server {
    listen 80;
    client_max_body_size 10m;          # allow statement uploads

    # Docker's built-in DNS. Resolving names at request time (via variables below) means
    # nginx still starts even if one backend service is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Each /api/<name>/... request is forwarded to a service with the prefix removed:
    #   /api/tx/summary/monthly  ->  transaction-service /summary/monthly
    location /api/tx/ {
        set $upstream http://transaction-service:8000;
        rewrite ^/api/tx/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/anomaly/ {
        set $upstream http://anomaly-service:8000;
        rewrite ^/api/anomaly/(.*)$ /$1 break;
        proxy_pass $upstream;
    }

    location /api/agent/ {
        set $upstream http://agent-service:8000;
        rewrite ^/api/agent/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_read_timeout 180s;       # the agent can take a while to answer
    }

    # Everything else is the React app
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}